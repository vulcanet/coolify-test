<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colorful Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            color: #ff4757;
            margin: 0;
        }
        p {
            color: #2f3542;
            font-size: 1.1rem;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            width: 280px;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card-content h3 {
            margin-top: 0;
            color: #2ed573;
        }
    </style>
</head>
<body>

    <header>
        <h1>Hello, World!</h1>
        <p>This is a bright and colorful sample webpage with images.</p>
    </header>

    <div class="container">
        <div class="card">
            <img src="https://picsum.photos" alt="Nature view">
            <div class="card-content">
                <h3>Nature View</h3>
                <p>A lovely scenic picture loaded dynamically from an online source.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos" alt="Cute puppy">
            <div class="card-content">
                <h3>Cute Puppy</h3>
                <p>Animals bring so much color and joy into our daily lives.</p>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos" alt="Mountain landscape">
            <div class="card-content">
                <h3>Mountain Peak</h3>
                <p>Explore the outdoors and enjoy the beautiful fresh air.</p>
            </div>
        </div>
    </div>

</body>
</html>
